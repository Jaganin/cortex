services:

  traefik:
    # v3.6+ required for the Docker provider: pre-3.6 Traefik's vendored Docker SDK
    # defaults to API 1.24, which Docker Engine 29 rejects outright. See traefik.yml.
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      # Read by traefik/dynamic/middlewares.yml (autoclaude-proxy-auth) via Go templating
      - AUTOCLAUDE_PROXY_AUTH_SECRET=${AUTOCLAUDE_PROXY_AUTH_SECRET}
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/secrets:/etc/traefik/secrets:ro
      - traefik-certs:/etc/traefik/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - proxy
    volumes:
      - ./authelia:/config
    environment:
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET=${AUTHELIA_OIDC_HMAC_SECRET}
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD=${AUTHELIA_SMTP_PASSWORD}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: authelia-redis
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - redis-data:/data

  homepage:
    image: homepage-jeedom:latest
    container_name: homepage
    restart: unless-stopped
    user: "1000:111"
    networks:
      - proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=dashboard.jaganin.duckdns.org
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  sharkord:
    image: sharkord/sharkord:latest
    container_name: sharkord
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "40000:40000/tcp"
      - "40000:40000/udp"
    volumes:
      - /mnt/synology/sharkorb:/home/bun/.config/sharkord

  leboncoin-mcp:
    # First service migrated to the Docker provider (canary) — validated against real
    # traffic (returns the expected 401 from leboncoin-mcp-auth) before the parallel
    # traefik/dynamic/services.yml entry was removed.
    build:
      context: ./lbc-mcp
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        CMD ["python", "-c", "import server; server.mcp.run(transport='http', host='0.0.0.0', port=8040)"]
    container_name: leboncoin-mcp
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.leboncoin-mcp.rule=Host(`leboncoin.jaganin.duckdns.org`)"
      - "traefik.http.routers.leboncoin-mcp.entrypoints=websecure"
      - "traefik.http.routers.leboncoin-mcp.tls.certresolver=duckdns"
      - "traefik.http.routers.leboncoin-mcp.middlewares=leboncoin-mcp-auth@file,secure-headers@file"
      - "traefik.http.services.leboncoin-mcp.loadbalancer.server.port=8040"

  # Read-only MCP server for the AutoClaude SysOps agent (#43), contract in
  # agents/sysops/knowledge/cortex-ops-contrat.md. Not routed by Traefik: only published
  # on the docker0 gateway, where the AutoClaude orchestrator reaches it
  # (connector `cortex-ops`, http://172.17.0.1:8050/mcp, Bearer CORTEX_OPS_TOKEN).
  cortex-ops:
    build: ./cortex-ops
    container_name: cortex-ops
    restart: unless-stopped
    # root without capabilities: enough to read the root-owned apt and journal logs,
    # nothing else (read-only rootfs, no privilege escalation)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - proxy         # TLS handshakes with traefik:443 (cert_expiry)
      - cortex-ops    # Docker socket proxy
    ports:
      - "${CORTEX_OPS_BIND:-172.17.0.1}:8050:8050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CORTEX_OPS_TOKEN=${CORTEX_OPS_TOKEN}
      - CORTEX_OPS_ALLOWED_HOSTS=${CORTEX_OPS_BIND:-172.17.0.1}:*
    volumes:
      - ./cortex-ops/config.yml:/app/config.yml:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/apt/sources.list.d:/host/etc/apt/sources.list.d:ro
      - /var/lib/dpkg:/host/var/lib/dpkg:ro
      - /var/lib/apt/lists:/host/var/lib/apt/lists:ro
      - /var/log/apt:/host/var/log/apt:ro
      - /var/log/journal:/host/var/log/journal:ro
      - /var/lib/cortex-ops/facts:/host/facts:ro
      - /var/lib/cortex-ops/backups:/host/backups:ro
    depends_on:
      - cortex-ops-docker

  # Docker API for cortex-ops, GET on containers and images only (POST=0: no start,
  # stop, exec...). Only reachable on the internal cortex-ops network.
  cortex-ops-docker:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: cortex-ops-docker
    restart: unless-stopped
    networks:
      - cortex-ops
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    name: proxy
    driver: bridge
  cortex-ops:
    internal: true

volumes:
  traefik-certs:
  redis-data:
