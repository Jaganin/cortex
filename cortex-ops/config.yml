# cortex-ops configuration (read-only MCP server for the SysOps agent).
# Mounted read-only into the container; edit and `docker compose restart cortex-ops`.
# Nothing here may be a secret.

# service_health: unauthenticated HTTP probes of the native (non-Docker) services.
# Any HTTP answer below 500 (including 401/403) counts as "up": the service answers.
services:
  - name: qbittorrent
    url: http://host.docker.internal:8080
  - name: openclaw-alfred
    url: http://host.docker.internal:18789
  - name: jeedom
    url: https://192.168.1.2
  - name: synology
    url: http://192.168.1.5:5000

# cert_expiry: TLS handshakes against Traefik (`traefik:443` on the proxy network), one
# per SNI. The wildcard covers one label only, hence the extra hosts with their own cert.
certificates:
  endpoint: traefik:443
  hosts:
    - jaganin.duckdns.org
    - auth.jaganin.duckdns.org
    - mycgp.jaganin.duckdns.org
    - preview.mycgp.jaganin.duckdns.org

# backup_status: targets expected in /var/lib/cortex-ops/backups/<target>.json (written by
# the backup script, see docs/deployment.md). Files found for other targets are listed too.
backups:
  max_age_hours: 26
  targets: []

# journal_errors: window and size of the aggregated report.
journal:
  since_hours: 24
  max_groups: 30
