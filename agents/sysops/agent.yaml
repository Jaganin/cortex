id: sysops
name: SysOps Cortex
description: >-
  Supervision système de Cortex : patchs de l'OS, santé de l'hôte et des conteneurs,
  montées de version des composants (Arr*, Paperless, Traefik, Authelia, etc.).
  Observe les machines en SSH (commandes whitelistées côté machine) et ouvre des tickets AutoClaude dans
  les repos concernés. Aucun changement appliqué sur la machine.

runtime:
  provider: claude
  model: claude-opus-5-5
  fallback_provider: codex
  image: default

instructions:
  system: prompt.md
  task: |
    Passage SysOps ({{ trigger.type }}). Reprendre l'état de la mémoire, inspecter
    Cortex, ouvrir ou mettre à jour les tickets nécessaires et finir par le bilan.

# Every 3-4 days (Monday and Thursday), 06:00 UTC. A fixed weekday pair is used rather
# than `*/3` in day-of-month, which resets at each month end and would give uneven gaps.
triggers:
  - type: manual
  - type: cron
    schedule: "0 6 * * 1,4"
concurrency: skip

# SSH access to Cortex and the Raspberry Pi (whitelisted commands enforced on the machine,
# restricted key + sudoers) is pending Jaganin/AutoClaude#491. Once delivered, declare
# `ssh: [{ref: cortex}, {ref: pi}]` here. Until then the agent has no access to the hosts.
mcp:
  - ref: autoclaude
    tools:
      # No close, merge, resume, stop or deploy tools.
      allow:
        - board_list
        - issue_get
        - issue_create
        - issue_update
        - issue_comment
        - issue_move
        - issue_agent_runs
        - agent_runs_recent
        - repo_docs

workspace:
  repos:
    - Jaganin/cortex
    - Jaganin/cortex-arr
  github: read

memory:
  mode: write
  max_kb: 64

budget:
  max_turns: 100
  max_duration: 40m
  priority: P2
  quota_share: 10%

notify:
  on: [waiting_input, failed, done]
